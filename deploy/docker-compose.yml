# TaskFloww — local development infrastructure.
# Brings up the stateful backing services the engine depends on:
#   PostgreSQL (source of truth) · RabbitMQ (transport + DLQ) · Prometheus (metrics).
#
# The orchestrator (Go) and workers (Python) are run from the host during early
# development and are added here as build services in later phases.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps
#   docker compose down          # add -v to also remove data volumes

name: taskfloww

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskfloww-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskfloww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskfloww}
      POSTGRES_DB: ${POSTGRES_DB:-taskfloww}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskfloww} -d ${POSTGRES_DB:-taskfloww}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [taskfloww]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taskfloww-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-taskfloww}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-taskfloww}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"      # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [taskfloww]

  prometheus:
    image: prom/prometheus:latest
    container_name: taskfloww-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks: [taskfloww]

volumes:
  pgdata:
  rabbitmqdata:
  promdata:

networks:
  taskfloww:
    driver: bridge
