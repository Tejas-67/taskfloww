# TaskFloww — plug-and-play configuration.
#
# This single file drives BOTH the Go orchestrator and the Python workers. The
# goal: onboard a new task without editing engine code — just add a function and
# map it here.
#
# Precedence (low → high): built-in defaults → this file → environment vars.
#   * ${VAR:-default} interpolates an env var into any value (default if unset).
#   * TASKFLOWW_<SECTION>__<KEY> overrides a value, e.g.
#     TASKFLOWW_BROKER__PREFETCH=64 or TASKFLOWW_DATABASE__URI=...
# Loaders: Go = koanf (orchestrator), Python = pydantic (worker). Invalid config
# fails fast with a list of every problem.

app:
  name: taskfloww
  environment: development       # development | staging | production

logging:
  level: info                    # debug | info | warn | error
  format: json                   # json | text (JSON = observability-first)

# --- Orchestrator HTTP server (health, metrics, future API) ---
server:
  http_addr: ":8080"

# --- Prometheus metrics ---
metrics:
  enabled: true
  path: /metrics
  worker_port: 9100              # port each worker exposes /metrics on

# --- PostgreSQL: the source of truth (state machine, scheduler, leases) ---
# Orchestrator only; workers ignore this section (ADR-0002 / B1).
database:
  uri: ${DATABASE_URI:-postgres://taskfloww:taskfloww@localhost:5432/taskfloww?sslmode=disable}
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_idle_seconds: 300

# --- RabbitMQ: transport for ready work + native DLX for the DLQ ---
broker:
  uri: ${BROKER_URI:-amqp://taskfloww:taskfloww@localhost:5672/}
  prefetch: 32                   # per-worker in-flight limit (backpressure)
  connection_name: taskfloww

# --- Queue topology & routing keys ---
queues:
  default_exchange: taskfloww.direct
  dead_letter_exchange: taskfloww.dlx
  definitions:
    - name: tasks.high
      routing_key: priority.high
      max_priority: 10
    - name: tasks.default
      routing_key: priority.default
      max_priority: 10
  dead_letter:
    name: tasks.dlq
    routing_key: dead

# --- Control channel: worker -> orchestrator (results + heartbeats) ---
control:
  exchange: taskfloww.control
  queue: taskfloww.control
  result_routing_key: result
  heartbeat_routing_key: heartbeat

# --- Default retry policy (per-task overridable at submission) ---
retry:
  max_retries: 5
  backoff:
    strategy: exponential        # exponential | fixed
    base_seconds: 2
    multiplier: 2.0
    max_seconds: 300
    jitter: true                 # avoid thundering-herd retries

# --- Fault tolerance timings (see docs/PLAN.md §8) ---
heartbeat:
  interval_seconds: 10           # worker -> orchestrator heartbeat cadence
  lease_ttl_seconds: 60          # must exceed interval + broker/consumer lag
  reaper_interval_seconds: 15    # how often the reaper scans for expired leases

# --- Scheduler / dispatcher tuning ---
scheduler:
  dispatch_batch_size: 100
  poll_interval_ms: 500

# --- Task -> Python function mappings (the plug-and-play core) ---
# `handler` is an importable "module:function" path in the worker environment.
# These point at the bundled examples (run the worker from the `worker/` dir).
tasks:
  - name: send_email
    handler: examples.tasks:send_email
    queue: tasks.default
    max_retries: 3
  - name: generate_report
    handler: examples.tasks:generate_report
    queue: tasks.high
    max_retries: 5
  - name: flaky
    handler: examples.tasks:always_fails
    queue: tasks.default
  - name: slow
    handler: examples.tasks:slow
    queue: tasks.default
